name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: littleboss
          POSTGRES_PASSWORD: littleboss_ci
          POSTGRES_DB: littleboss_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U littleboss"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway database that exists only inside this CI job.
      TEST_DATABASE_URL: postgres://littleboss:littleboss_ci@localhost:5432/littleboss_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
